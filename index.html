<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bank or bust</title>
<meta name="description" content="Eat, grow, lock it in, and become the thing that hunted you. A one-thumb ocean game.">
<style>
:root{--bg:#FAF9F5;--card:#FFFFFF;--tint:#F1EFE8;--text:#1F1E1D;--text2:#5F5E5A;--border:rgba(0,0,0,.14);--ok:#1D9E75;--risk:#EF9F27;--btn:#1F1E1D;--btnText:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#1F1E1D;--card:#2C2C2A;--tint:#2C2C2A;--text:#F1EFE8;--text2:#B4B2A9;--border:rgba(255,255,255,.16);--ok:#5DCAA5;--risk:#FAC775;--btn:#F1EFE8;--btnText:#1F1E1D}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1100px;margin:0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.hud{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px}
.card{background:var(--tint);border-radius:8px;padding:8px 12px}
.label{font-size:13px;color:var(--text2)}
.val{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden}
#goal{font-size:15px;font-weight:500;margin-bottom:6px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--tint)}
#lock{width:0;background:var(--ok)}
#risk{width:0;background:var(--risk)}
.legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text2);margin:6px 0 10px}
.legend b{font-weight:500;color:var(--text)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.sw.ok{background:var(--ok)}
.sw.risk{background:var(--risk);margin-left:12px}
#wrap{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;max-width:320px;text-align:center}
#msg{font-size:18px;font-weight:500;margin-bottom:8px}
#sub{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:14px}
button{font:inherit;font-size:15px;font-weight:500;padding:10px 28px;border:0;border-radius:8px;background:var(--btn);color:var(--btnText);cursor:pointer}
button:active{transform:scale(.98)}
</style>
</head>
<body>
<div id="app">
  <h1 class="sr-only">Bank or bust</h1>
  <div class="hud">
    <div class="card"><div class="label">You are</div><div class="val" id="name">Minnow</div></div>
    <div class="card"><div class="label">Length</div><div class="val" id="len">3.0 cm</div></div>
    <div class="card"><div class="label">Score</div><div class="val" id="score">0</div></div>
  </div>
  <div id="goal">Goal: eat the hunter and become it</div>
  <div class="bar"><div id="lock"></div><div id="risk"></div></div>
  <div class="legend">
    <span><i class="sw ok"></i>Locked in<i class="sw risk"></i>At risk</span>
    <span>Hunter: <b id="next">Perch</b> · Best <b id="best">0</b></span>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="ov">
      <div class="panel">
        <div id="msg">Become the leviathan</div>
        <div id="sub">Eat green fish to grow. Orange ones eat you.<br>Touch home to lock in your growth.<br>Outgrow the hunter, eat it, and become it.</div>
        <button id="go">Start</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  // Tuning: every number that changes how the game feels lives here.
  const CFG = {
    startSize: 10, maxSize: 46, eatHunterAt: 44, hunterAppearsAt: 22,
    eatRatio: 0.9, dangerRatio: 1.15,
    speed: 270, slowPerSize: 4.4,
    hunterSpeed: 140, hunterSpeedPerStage: 8, hunterTurn: 1.9, hunterRadius: 38,
    growth: 0.13, growthSlowPerStage: 0.15,
    comboStep: 3, comboMax: 8, hunterPoints: 300,
    startLengthCm: 3, lengthPerStage: 4.6,
    baseFish: 11
  };
  const NAMES = ['Minnow', 'Perch', 'Barracuda', 'Shark', 'Orca', 'Whale', 'Leviathan'];
  const LAST = NAMES.length - 2;
  const K = CFG.startSize / CFG.maxSize;
  const SPAN = CFG.eatHunterAt - CFG.startSize;

  const el = id => document.getElementById(id);
  const c = el('c'), x = c.getContext('2d'), wrap = el('wrap'), ov = el('ov');
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const P = dark
    ? { water: '#042C53', reef: '#085041', reefS: '#5DCAA5', reefT: '#9FE1CB', me: '#FAC775', food: '#5DCAA5', bad: '#F0997B', mid: '#888780', hunter: '#F1EFE8', patch: '#2C2C2A', ink: '#E6F1FB' }
    : { water: '#E6F1FB', reef: '#9FE1CB', reefS: '#0F6E56', reefT: '#085041', me: '#EF9F27', food: '#1D9E75', bad: '#D85A30', mid: '#B4B2A9', hunter: '#2C2C2A', patch: '#F1EFE8', ink: '#042C53' };
  const font = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  const home = { x: 0, y: 0, r: 40 }, tgt = { x: 0, y: 0 };
  let W = 680, H = 520, dpr = 1, state = 'idle';
  let fish = [], pops = [], me = null, boss = null, bossWait = 0, joy = null, useT = false;
  let tier = 0, lock = CFG.startSize, banked = 0, haul = 0, streak = 0, eaten = 0, tut = 0;
  let elapsed = 0, evoT = 0, shake = 0, last = 0, told = false, best = 0;
  try { best = +localStorage.getItem('bob-best') || 0; } catch (e) {}
  el('best').textContent = best;

  function size() {
    W = wrap.clientWidth || 680;
    H = wrap.clientHeight || 520;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
    home.x = W / 2;
    home.y = H - 52;
    if (me) { me.x = Math.min(W - me.s, me.x); me.y = Math.min(H - me.s, me.y); }
  }
  function mult() { return Math.min(CFG.comboMax, 1 + Math.floor(streak / CFG.comboStep)); }
  function pop(t, px, py, col) { pops.push({ t, x: Math.max(80, Math.min(W - 80, px)), y: py, col, life: 1.4 }); }
  function fmtLen() {
    const s = me ? me.s : CFG.startSize;
    const cm = CFG.startLengthCm * Math.pow(CFG.lengthPerStage, Math.min(tier, LAST)) * s / CFG.startSize;
    if (cm < 100) return (cm < 10 ? cm.toFixed(1) : Math.round(cm)) + ' cm';
    const m = cm / 100;
    if (m < 1000) return (m < 10 ? m.toFixed(1) : Math.round(m)) + ' m';
    return (m / 1000).toFixed(1) + ' km';
  }
  function fmtTime() { const t = Math.floor(elapsed); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }

  function spawn(init) {
    const left = Math.random() < 0.5, s = me ? me.s : CFG.startSize;
    let r = Math.random() < 0.55 ? s * (0.35 + 0.5 * Math.random()) : 8 + 40 * Math.pow(Math.random(), 1.6);
    r = Math.max(4, Math.min(48, r));
    fish.push({
      x: init ? Math.random() * W : (left ? -r * 2 : W + r * 2),
      y: 24 + Math.random() * Math.max(60, H - 150),
      r, v: (45 + Math.random() * 70) * (1 + 0.06 * tier) * (left ? 1 : -1), ph: Math.random() * 6.28
    });
  }
  function goHome() { me.x = home.x; me.y = home.y; tgt.x = home.x; tgt.y = home.y; useT = false; }

  // Banking locks in size and points. A bust drops you back to the last lock.
  function bank() {
    banked += haul;
    pop(haul > 0 ? 'Locked in +' + haul : 'Locked in', home.x, home.y - 60, P.ink);
    haul = 0; streak = 0; lock = me.s;
    if (tut === 1) tut = 2;
  }
  function bust() {
    pop('Bust, growth lost', me.x, me.y - 24, P.bad);
    haul = 0; streak = 0; told = lock >= CFG.eatHunterAt;
    shake = 0.35; boss = null; bossWait = 4;
    me.s = lock; me.safe = 1.6; goHome();
  }
  function eat(f) {
    eaten++; streak++;
    const pts = Math.round(f.r) * mult() * (tier + 1);
    haul += pts;
    me.s = Math.min(CFG.maxSize, me.s + f.r * CFG.growth / (1 + CFG.growthSlowPerStage * tier));
    pop('+' + pts, f.x, f.y - f.r - 4, P.food);
    if (tut === 0 && eaten >= 3) tut = 1;
    if (me.s >= CFG.eatHunterAt && !told) { told = true; pop('You can eat the ' + NAMES[tier + 1], me.x, me.y - me.s - 30, P.ink); }
  }
  function win() {
    state = 'won'; tier = NAMES.length - 1; me.s = CFG.maxSize;
    best = Math.max(best, banked);
    try { localStorage.setItem('bob-best', best); } catch (e) {}
    el('best').textContent = best;
    el('msg').textContent = 'You are the leviathan';
    el('sub').textContent = 'From ' + CFG.startLengthCm + ' cm to ' + fmtLen() + ' in ' + fmtTime() + ', with a score of ' + banked + '.';
    el('go').textContent = 'Play again';
    ov.style.display = 'flex';
  }
  function eatBoss() {
    streak++;
    const pts = CFG.hunterPoints * (tier + 1) * mult();
    banked += haul + pts; haul = 0; streak = 0; told = false; boss = null; shake = 0.2;
    if (tier >= LAST) { win(); return; }
    state = 'evolve'; evoT = 0; me.s = CFG.maxSize;
    pop('Evolved into ' + NAMES[tier + 1] + ' +' + pts, me.x, me.y - 70, P.ink);
  }
  // After the zoom-out, the old sea is kept at its new, smaller scale: old predators become food.
  function finishEvolve() {
    tier++;
    fish = fish.map(f => ({
      x: me.x + (f.x - me.x) * K, y: me.y + (f.y - me.y) * K, r: f.r * K,
      v: (45 + Math.random() * 70) * (f.v > 0 ? 1 : -1), ph: f.ph
    })).filter(f => f.r >= 3);
    me.s = CFG.startSize; lock = CFG.startSize; me.safe = 1.5; bossWait = 2;
    tgt.x = me.x; tgt.y = me.y; useT = false; state = 'play';
  }

  function update(dt) {
    for (const p of pops) { p.life -= dt; p.y -= 26 * dt; }
    pops = pops.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt);
    if (state === 'evolve') { evoT += dt; if (evoT >= 1.3) finishEvolve(); return; }

    for (const f of fish) { f.x += f.v * dt; f.ph += dt * 2; }
    fish = fish.filter(f => f.x > -110 && f.x < W + 110);
    const area = Math.max(0.6, Math.min(2.2, W * H / 353600));
    const want = Math.round((CFG.baseFish + (state === 'play' ? tier : 0)) * area);
    while (fish.length < want) spawn(false);
    if (state !== 'play') return;

    elapsed += dt;
    const sp = CFG.speed - (me.s - CFG.startSize) * CFG.slowPerSize;
    if (joy) {
      const m = Math.hypot(joy.dx, joy.dy);
      if (m > 6) {
        const k = Math.min(1, m / 36);
        me.x += joy.dx / m * sp * k * dt; me.y += joy.dy / m * sp * k * dt;
        me.a = Math.atan2(joy.dy, joy.dx);
      }
    } else if (useT) {
      const dx = tgt.x - me.x, dy = tgt.y - me.y, d = Math.hypot(dx, dy);
      if (d > 3) { const st = Math.min(d, sp * dt); me.x += dx / d * st; me.y += dy / d * st; me.a = Math.atan2(dy, dx); }
    }
    me.x = Math.max(me.s, Math.min(W - me.s, me.x));
    me.y = Math.max(me.s, Math.min(H - me.s, me.y));
    me.safe = Math.max(0, me.safe - dt);

    const inHome = Math.hypot(me.x - home.x, me.y - home.y) < home.r;
    if (inHome && (haul > 0 || me.s > lock)) bank();
    if (inHome && boss && !boss.leave && me.s < CFG.eatHunterAt) {
      boss.leave = true; boss.a = boss.x < W / 2 ? Math.PI : 0; bossWait = 3;
    }

    for (let i = fish.length - 1; i >= 0; i--) {
      const f = fish[i], fy = f.y + Math.sin(f.ph) * 4, dd = Math.hypot(f.x - me.x, fy - me.y);
      if (f.r <= me.s * CFG.eatRatio && dd < me.s + f.r * 0.5) { eat(f); fish.splice(i, 1); }
      else if (f.r >= me.s * CFG.dangerRatio && dd < f.r * 0.9 + me.s * 0.4 && !inHome && me.safe <= 0) { bust(); return; }
    }

    if (!boss) {
      bossWait -= dt;
      if (me.s >= CFG.hunterAppearsAt && bossWait <= 0 && !inHome) {
        const left = me.x > W / 2;
        boss = { x: left ? -70 : W + 70, y: 50 + Math.random() * Math.max(40, H - 220), a: left ? 0 : Math.PI, r: CFG.hunterRadius, leave: false };
        pop(NAMES[tier + 1] + ' incoming', left ? 90 : W - 90, boss.y, P.bad);
      }
    } else {
      if (!boss.leave) {
        let df = Math.atan2(me.y - boss.y, me.x - boss.x) - boss.a;
        df = Math.atan2(Math.sin(df), Math.cos(df));
        boss.a += Math.max(-CFG.hunterTurn * dt, Math.min(CFG.hunterTurn * dt, df));
      }
      const bs = CFG.hunterSpeed + CFG.hunterSpeedPerStage * tier;
      boss.x += Math.cos(boss.a) * bs * dt; boss.y += Math.sin(boss.a) * bs * dt;
      if (boss.leave) { if (boss.x < -90 || boss.x > W + 90) boss = null; }
      else if (Math.hypot(boss.x - me.x, boss.y - me.y) < boss.r * 0.8 + me.s * 0.5) {
        if (me.s >= CFG.eatHunterAt) eatBoss();
        else if (!inHome && me.safe <= 0) bust();
      }
    }
  }

  function drawFish(px, py, r, a, col, eye, patch) {
    x.save(); x.translate(px, py); x.rotate(a); if (Math.cos(a) < 0) x.scale(1, -1);
    x.fillStyle = col;
    x.beginPath(); x.ellipse(0, 0, r * 1.2, r * 0.78, 0, 0, 6.283); x.fill();
    x.beginPath(); x.moveTo(-r * 0.95, 0); x.lineTo(-r * 1.8, -r * 0.65); x.lineTo(-r * 1.8, r * 0.65); x.closePath(); x.fill();
    if (patch) {
      x.fillStyle = patch;
      x.beginPath(); x.ellipse(r * 0.5, -r * 0.32, r * 0.3, r * 0.13, -0.3, 0, 6.283); x.fill();
      x.beginPath(); x.ellipse(r * 0.1, r * 0.5, r * 0.7, r * 0.18, 0, 0, 6.283); x.fill();
    }
    x.fillStyle = eye;
    x.beginPath(); x.arc(r * 0.68, -r * 0.12, Math.max(1.2, r * 0.11), 0, 6.283); x.fill();
    x.restore();
  }

  function draw() {
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.fillStyle = P.water; x.fillRect(0, 0, W, H);
    if (shake > 0) x.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);

    x.fillStyle = P.reef; x.strokeStyle = P.reefS; x.lineWidth = 1.5;
    x.beginPath(); x.arc(home.x, home.y, home.r, 0, 6.283); x.fill(); x.stroke();
    x.fillStyle = P.reefT; x.font = '500 13px ' + font; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('Home', home.x, home.y);

    const live = (state === 'play' || state === 'evolve') && me;
    x.save();
    if (state === 'evolve') {
      const t = Math.min(1, evoT / 1.3), e = t * t * (3 - 2 * t), k = 1 - (1 - K) * e;
      x.translate(me.x, me.y); x.scale(k, k); x.translate(-me.x, -me.y);
    }
    for (const f of fish) {
      const col = live ? (f.r <= me.s * CFG.eatRatio ? P.food : (f.r >= me.s * CFG.dangerRatio ? P.bad : P.mid)) : P.mid;
      drawFish(f.x, f.y + Math.sin(f.ph) * 4, f.r, f.v > 0 ? 0 : Math.PI, col, P.water);
    }
    if (boss) {
      drawFish(boss.x, boss.y, boss.r, boss.a, P.hunter, P.hunter, P.patch);
      if (live && me.s >= CFG.eatHunterAt && !boss.leave) {
        x.strokeStyle = P.food; x.lineWidth = 2;
        x.beginPath(); x.arc(boss.x, boss.y, boss.r * 1.5, 0, 6.283); x.stroke();
      }
    }
    if (live && !(me.safe > 0 && Math.floor(me.safe * 10) % 2)) drawFish(me.x, me.y, me.s, me.a, P.me, P.water);
    x.restore();

    if (state === 'play' && haul > 0) {
      x.fillStyle = P.ink; x.font = '500 13px ' + font;
      x.fillText(haul + (mult() > 1 ? '  x' + mult() : ''), Math.max(40, Math.min(W - 40, me.x)), Math.max(14, me.y - me.s - 14));
    }
    if (joy && state === 'play') {
      x.strokeStyle = P.mid; x.lineWidth = 1.5;
      x.beginPath(); x.arc(joy.ax, joy.ay, 36, 0, 6.283); x.stroke();
      const m = Math.hypot(joy.dx, joy.dy) || 1, k = Math.min(36, m) / m;
      x.fillStyle = P.mid;
      x.beginPath(); x.arc(joy.ax + joy.dx * k, joy.ay + joy.dy * k, 10, 0, 6.283); x.fill();
    }
    x.font = '500 14px ' + font;
    for (const p of pops) {
      x.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
      x.fillStyle = p.col; x.fillText(p.t, p.x, Math.max(14, p.y));
    }
    x.globalAlpha = 1;
  }

  function hud() {
    el('name').textContent = NAMES[tier];
    el('len').textContent = fmtLen();
    el('score').textContent = Math.round(banked);
    el('next').textContent = tier < NAMES.length - 1 ? NAMES[tier + 1] : 'none';
    const s = me ? me.s : CFG.startSize;
    const lp = Math.max(0, Math.min(1, (lock - CFG.startSize) / SPAN));
    const cp = Math.max(0, Math.min(1, (s - CFG.startSize) / SPAN));
    el('lock').style.width = (lp * 100).toFixed(1) + '%';
    el('risk').style.width = (Math.max(0, cp - lp) * 100).toFixed(1) + '%';
    let g = 'Goal: eat the hunter and become it';
    if (state === 'won') g = 'You reached the top of the food chain';
    else if (state === 'play' || state === 'evolve') {
      const b = NAMES[tier + 1];
      if (tut === 0) g = 'Drag to swim. Eat the green fish.';
      else if (tut === 1) g = 'Now touch home to lock in your growth.';
      else if (s >= CFG.eatHunterAt) g = 'Eat the ' + b + ' to become it.';
      else if (s > lock + 8) g = 'Growth at risk. Home locks it in.';
      else g = 'Outgrow the ' + b + ', then eat it.';
    }
    el('goal').textContent = g;
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t; update(dt); draw(); hud();
    requestAnimationFrame(frame);
  }

  // Input: mouse follows the pointer, touch is a drag-anywhere joystick.
  function pos(e) { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  c.addEventListener('pointerdown', function (e) {
    const p = pos(e);
    if (e.pointerType === 'mouse') { tgt.x = p.x; tgt.y = p.y; useT = true; }
    else { joy = { ax: p.x, ay: p.y, dx: 0, dy: 0 }; useT = false; try { c.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  c.addEventListener('pointermove', function (e) {
    const p = pos(e);
    if (e.pointerType === 'mouse') { tgt.x = p.x; tgt.y = p.y; useT = true; }
    else if (joy) { joy.dx = p.x - joy.ax; joy.dy = p.y - joy.ay; }
  });
  function up(e) { if (e.pointerType !== 'mouse') joy = null; }
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);

  el('go').addEventListener('click', function () {
    tier = 0; lock = CFG.startSize; banked = 0; haul = 0; streak = 0; eaten = 0; tut = 0; elapsed = 0;
    boss = null; bossWait = 0; told = false; pops = []; fish = []; joy = null;
    me = { x: home.x, y: home.y, s: CFG.startSize, a: -Math.PI / 2, safe: 1.2 };
    goHome();
    for (let i = 0; i < 10; i++) spawn(true);
    state = 'play'; ov.style.display = 'none';
  });

  window.addEventListener('resize', size);
  size();
  for (let i = 0; i < 10; i++) spawn(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
